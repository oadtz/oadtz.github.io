<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1d4a"/>
      <stop offset="1" stop-color="#0a0a16"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee7ff"/>
      <stop offset="1" stop-color="#ff6bd6"/>
    </linearGradient>
    <clipPath id="tile">
      <rect width="256" height="256" rx="56"/>
    </clipPath>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <!-- cardigan, collar and tie -->
    <path d="M40 256c4-34 34-46 64-50h48c30 4 60 16 64 50Z" fill="#8a8a8c"/>
    <path d="M100 204l28 44 28-44-10-12h-36Z" fill="#fff"/>
    <path d="M120 210h16l6 46h-28Z" fill="#5a4fa0"/>
    <!-- hair behind the head -->
    <path d="M42 150C30 78 70 30 128 30s98 48 86 120c-2 16-8 28-14 36l-8-40H64l-8 40c-6-8-12-20-14-36Z" fill="#1b1512"/>
    <!-- ears, neck and face -->
    <ellipse cx="54" cy="146" rx="10" ry="16" fill="#edd3c2"/>
    <ellipse cx="202" cy="146" rx="10" ry="16" fill="#edd3c2"/>
    <path d="M108 190h40v22l-20 12-20-12Z" fill="#e9cdbb"/>
    <path d="M56 120c0 50 30 86 72 86s72-36 72-86c0-30-30-50-72-50s-72 20-72 50Z" fill="#f6e3d6"/>
    <!-- fringe: straight bangs with pointed strands, longer at the sides -->
    <path d="M46 150C36 84 72 40 128 40s92 44 82 110l-10-34-8 24-10-36-12 30-10-34-14 32-10-34-14 34-10-34-12 32-10-32-10 28-8-28Z" fill="#1b1512"/>
    <path d="M78 62c22-14 62-16 92-2-30-4-62-4-92 2Z" fill="#5a4636"/>
    <!-- eyes -->
    <ellipse cx="96" cy="142" rx="10" ry="13" fill="#6b452e"/>
    <ellipse cx="160" cy="142" rx="10" ry="13" fill="#6b452e"/>
    <circle cx="99" cy="137" r="3.5" fill="#fff"/>
    <circle cx="163" cy="137" r="3.5" fill="#fff"/>
    <!-- glasses -->
    <g fill="#ffffff" fill-opacity="0.12" stroke="#0e0d10" stroke-width="10">
      <rect x="66" y="118" width="56" height="46" rx="20"/>
      <rect x="134" y="118" width="56" height="46" rx="20"/>
    </g>
    <path d="M122 138q6-5 12 0" fill="none" stroke="#0e0d10" stroke-width="8" stroke-linecap="round"/>
    <!-- mouth -->
    <path d="M116 186q12 6 24 0" fill="none" stroke="#b9716a" stroke-width="5" stroke-linecap="round"/>
  </g>
  <rect x="6" y="6" width="244" height="244" rx="50" fill="none" stroke="url(#ring)" stroke-width="6" opacity="0.9"/>
</svg>
